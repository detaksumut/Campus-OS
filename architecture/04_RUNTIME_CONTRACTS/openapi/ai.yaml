openapi: 3.1.0
info:
  title: AI Runtime API
  version: 1.0.0
  description: API specification for the Campus OS AI Runtime.
servers:
  - url: https://api.campus-os.local/ai
paths:
  /chat:
    post:
      summary: Send a message to an AI agent
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/ai-chat-request.json'
      responses:
        '200':
          description: AI response generated
  /completion:
    post:
      summary: Request a text completion for a prompt
      operationId: generateCompletion
      responses:
        '200':
          description: Completion generated
  /memory/{sessionId}:
    get:
      summary: Retrieve the memory context of a specific session
      operationId: getMemory
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session memory retrieved
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
