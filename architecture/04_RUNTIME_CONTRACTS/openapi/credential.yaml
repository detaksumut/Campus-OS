openapi: 3.1.0
info:
  title: Credential Runtime API
  version: 1.0.0
  description: API specification for the Campus OS Credential Runtime.
servers:
  - url: https://api.campus-os.local/credential
paths:
  /issue:
    post:
      summary: Issue a new verifiable credential
      operationId: issueCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/credential-issue-request.json'
      responses:
        '201':
          description: Credential issued
  /{id}/revoke:
    post:
      summary: Revoke an existing credential
      operationId: revokeCredential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credential revoked
  /{id}/verify:
    get:
      summary: Verify the authenticity of a credential
      operationId: verifyCredential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credential is valid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
