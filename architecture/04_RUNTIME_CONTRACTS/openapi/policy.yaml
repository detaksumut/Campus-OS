openapi: 3.1.0
info:
  title: Policy Runtime API
  version: 1.0.0
  description: API specification for the Campus OS Policy Runtime.
servers:
  - url: https://api.campus-os.local/policy
paths:
  /evaluate:
    post:
      summary: Evaluate a set of rules against a given context
      operationId: evaluatePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/policy-evaluate-request.json'
      responses:
        '200':
          description: Evaluation result
  /rules:
    post:
      summary: Add or update a policy rule
      operationId: upsertRule
      responses:
        '200':
          description: Rule updated
  /rules/{id}:
    get:
      summary: Retrieve a specific policy rule
      operationId: getRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rule retrieved
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
