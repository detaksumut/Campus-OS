openapi: 3.1.0
info:
  title: Identity Runtime API
  version: 1.0.0
  description: API specification for the Campus OS Identity Runtime.
servers:
  - url: https://api.campus-os.local/identity
paths:
  /login:
    post:
      summary: Authenticate and establish a session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/identity-login-request.json'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '../schemas/identity-login-response.json'
        '401':
          description: Authentication failed
  /token:
    post:
      summary: Refresh or issue tokens
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed
  /profile:
    get:
      summary: Retrieve the current authenticated user's profile
      operationId: getProfile
      responses:
        '200':
          description: Profile retrieved
    put:
      summary: Update user profile information
      operationId: updateProfile
      responses:
        '200':
          description: Profile updated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
